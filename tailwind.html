<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interactive Student Card</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-200 min-h-screen flex items-center justify-center">

    <div class="
        w-80
        bg-blue-500
        p-6
        border
        border-blue-700
        rounded-2xl
        shadow-md
        hover:shadow-2xl
        transition
        duration-300
    ">

        <h1 class="
            text-2xl
            font-bold
            text-white
            text-center
        ">
            Uma
        </h1>

        <p class="
            text-white
            text-center
            mt-4
        ">
            MCA Student passionate about Web Development
            and Programming.
        </p>

        <div class="text-center mt-6">

            <button class="
                bg-white
                text-blue-600
                font-semibold
                px-5
                py-2
                rounded-lg
                hover:bg-blue-900
                hover:text-white
                transition
                duration-300
            ">
                View Profile
            </button>

        </div>

    </div>

</body>
</html>
